<!doctype html>
<html lang="en">

<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-DNLMJW0HWE"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());
		gtag('config', 'G-DNLMJW0HWE');
	</script>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description"
		content="Arihant's personal website featuring blog posts, coding projects, music covers, photos, and research work." />
	<meta name="author" content="Arihant" />
	<meta name="theme-color" content="#FF5722" />
	<meta name="robots" content="index, follow" />
	<title>Arihant's Corner</title>
	<meta property="og:site_name" content="Arihant's Corner" />
	<meta property="og:locale" content="en_US" />
	<meta name="twitter:card" content="summary_large_image" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<script>
		// Initialize dark mode before page renders to prevent flash
		(function () {
			const stored = localStorage.getItem('darkMode');
			const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
			const darkMode = stored !== null ? stored === 'true' : prefersDark;
			if (darkMode) {
				document.documentElement.classList.add('dark');
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
